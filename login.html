<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — KuwaitSat-1 Mission Hub</title>
<!-- CSP is owned by 03 · Security (03-security/docs/csp-meta.html) and ships as a
     Vercel response header. This page is already script-src 'self' clean: no
     inline <script>, no onclick= anywhere. Keep it that way. -->
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<main class="wrap wrap-narrow" style="max-width:520px">

  <div class="section">
    <h1 id="form-title">Researcher sign in</h1>
    <p class="muted small" id="form-sub">Sign in to reach your own missions, data and reports.</p>

    <!-- One banner, three jobs: working, worked, failed-and-here-is-why.
         aria-live so a screen reader hears the outcome too. -->
    <div class="banner" id="form-banner" role="status" aria-live="polite" hidden></div>

    <form class="card" id="auth-form" novalidate>

      <div class="field" id="f-name" hidden>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name">
        <div class="err" id="e-name" hidden></div>
      </div>

      <div class="field" id="f-org" hidden>
        <label for="org">Organization</label>
        <input id="org" name="org" type="text" autocomplete="organization">
        <div class="err" id="e-org" hidden></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <div class="err" id="e-email" hidden></div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <div class="err" id="e-password" hidden></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" type="submit" id="submit-btn">Sign in</button>
        <button class="btn btn-ghost" type="button" id="toggle">Create an account</button>
      </div>
    </form>

    <!-- se-m3: THE DEMO-CREDENTIALS BLOCK THAT USED TO SIT HERE IS GONE, AND
         MUST NOT COME BACK. It printed two email addresses and their password
         on a public page. Supabase Auth holds the password hash; this project
         stores no password and displays none. Whoever is presenting types the
         two demo accounts in from a password manager. -->
    <p class="small muted" style="margin-top:20px">Access is restricted to authorized
      researchers. Each account sees only its own missions, data and reports.</p>
  </div>

</main>

<footer id="site-footer"></footer>

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/agents.js"></script>
<script src="js/ui.js"></script>
<script src="js/seed.js"></script>
<script src="js/data.js"></script>
<script src="js/page-login.js"></script>

</body>
</html>
