<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report — KuwaitSat-1 Mission Hub</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<div id="boot" class="boot">Checking access…</div>

<main class="wrap wrap-narrow" id="app" hidden>
  <div id="content"></div>
</main>

<footer id="site-footer"></footer>

<script src="vendor/supabase.js"></script>

<script src="js/config.js"></script>

<script src="js/agents.js"></script>
<script src="js/seed.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script>
guard(function (user) {
  var id = qs('id');

  function notFound(msg) {
    $('#content').innerHTML =
      '<div class="card empty">' +
        '<div class="mark">—</div>' +
        '<h1>' + esc(msg) + '</h1>' +
        '<p><a class="btn btn-primary" href="missions.html">Back to my missions</a></p>' +
      '</div>';
  }

  if (!id) { notFound('Mission not found, or you do not have access to it'); return; }

  Promise.all([Data.getMission(id), Data.getReport(id)]).then(function (res) {
    var mission = res[0], report = res[1];
    if (!mission) { notFound('Mission not found, or you do not have access to it'); return; }
    if (!report) { notFound('No report has been generated for this mission yet'); return; }

    $('#content').innerHTML = '' +
      '<div class="section no-print">' +
        '<p class="small"><a href="mission.html?id=' + encodeURIComponent(mission.id) + '">← Back to mission</a></p>' +
      '</div>' +

      '<article class="report">' +
        '<h1>' + esc(mission.title) + '</h1>' +
        '<p class="meta">' + esc(user.name) + ' · ' + esc(user.org) + '<br>' +
          'Generated ' + esc(fmtDateTime(report.generatedAt)) + ' · Mission ID <span class="mono">' +
          esc(mission.id) + '</span></p>' +
        '<hr class="rule">' +
        report.sections.map(function (s) {
          return '<h2>' + esc(s.heading) + '</h2>' +
                 '<p style="white-space:pre-line">' + esc(s.body) + '</p>';
        }).join('') +
        '<hr class="rule">' +
        '<p class="meta">Generated by KuwaitSat-1 Mission Hub. Sample data — not for operational use.</p>' +
      '</article>' +

      '<div class="btn-row no-print" style="margin-top:20px">' +
        '<button class="btn btn-primary" id="print">Print / Save as PDF</button>' +
        '<a class="btn btn-ghost" href="missions.html">My missions</a>' +
      '</div>';

    $('#print').addEventListener('click', function () { window.print(); });
  });
});
</script>

</body>
</html>
