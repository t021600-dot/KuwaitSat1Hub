<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New mission — KuwaitSat-1 Mission Hub</title>
<!-- CSP is owned by 03 · Security (03-security/docs/csp-meta.html) and ships as a
     Vercel response header. This page is already script-src 'self' clean: no
     inline <script>, no onclick= anywhere. Keep it that way. -->
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<div id="boot" class="boot">Checking access…</div>

<main class="wrap" id="app" hidden>

  <div class="section">
    <p class="small"><a href="missions.html">← My missions</a></p>
    <h1>New mission</h1>
    <p class="muted small">Write the question. The agents handle the steps.</p>
  </div>

  <!-- Working / worked / failed-and-why, all in one place. -->
  <div class="banner" id="form-banner" role="status" aria-live="polite" hidden></div>

  <form id="mission-form" novalidate>
  <div class="grid-2">

    <div class="card">
      <!-- NO maxlength ON EITHER FIELD. maxlength truncates a long paste in
           silence, the form then accepts the shortened text and a row IS
           created — the form refused nothing. The counters below plus the
           database CHECK constraints do the refusing, visibly. -->
      <div class="field">
        <label for="title">Mission title</label>
        <input id="title" type="text" placeholder="Vegetation potential — Jahra corridor">
        <div class="hint"><span id="title-count">0</span>/120 characters</div>
        <div class="err" id="e-title" hidden></div>
      </div>

      <div class="field">
        <label for="objective">Research objective</label>
        <textarea id="objective" rows="6"
          placeholder="Identify areas in Kuwait where increasing vegetation could improve environmental conditions."></textarea>
        <div class="hint"><span id="objective-count">0</span>/1,500 characters — at least 20.</div>
        <div class="err" id="e-objective" hidden></div>
      </div>
    </div>

    <div class="card">
      <h2>Area of interest</h2>
      <p class="small muted" id="map-hint">Tap one corner on the map, then tap the opposite corner.
        Tap again to start over.</p>
      <div id="picker" class="map" role="application"
           aria-label="Map of Kuwait. Select an area by tapping two opposite corners, or use the numeric fields below."></div>

      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-sm" type="button" id="use-view">Use current map view</button>
        <button class="btn btn-sm btn-ghost" type="button" id="clear-area">Clear area</button>
      </div>

      <p class="mono" id="bounds-text" style="margin-top:12px">No area selected.</p>
      <div class="err" id="e-area" hidden></div>

      <details style="margin-top:12px" id="coords">
        <summary class="small muted" style="cursor:pointer">Type the coordinates instead</summary>
        <!-- The four bounds are the ones kuwait_area_ok() accepts:
             46.5–48.8 E, 28.5–30.1 N (DECISIONS D-3). -->
        <div class="grid-2" style="gap:12px;margin-top:12px">
          <div class="field"><label for="n">North latitude</label><input id="n" type="number" step="0.01" min="28.5" max="30.1"></div>
          <div class="field"><label for="s">South latitude</label><input id="s" type="number" step="0.01" min="28.5" max="30.1"></div>
          <div class="field"><label for="e">East longitude</label><input id="e" type="number" step="0.01" min="46.5" max="48.8"></div>
          <div class="field"><label for="w">West longitude</label><input id="w" type="number" step="0.01" min="46.5" max="48.8"></div>
        </div>
        <button class="btn btn-sm" type="button" id="apply-coords">Apply coordinates</button>
      </details>
    </div>

  </div>

  <div class="btn-row" style="margin-top:24px">
    <button class="btn btn-primary" type="submit" id="launch">Launch Mission</button>
    <span class="small muted" id="launch-reason"></span>
  </div>
  </form>

</main>

<footer id="site-footer"></footer>

<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/agents.js"></script>
<script src="js/ui.js"></script>
<script src="js/seed.js"></script>
<script src="js/data.js"></script>
<script src="js/page-new-mission.js"></script>

</body>
</html>
